name: 버그·문제
description: 동작이 예상과 다를 때
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      placeholder: 셀 2 히터를 껐는데 CAUTION이 계속 켜졌다 꺼졌다 반복함
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 원래 어떻게 돼야 하나요
      description: 관련 REQ·TC 번호가 있으면 적어 주세요.
      placeholder: 원인이 사라지고 20초가 지난 뒤 한 번만 NORMAL로 바뀌어야 함 (REQ-013, TC-006)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 다시 일으키는 방법
      placeholder: |
        1. 셀 2 히터 ON, CAUTION 될 때까지 대기
        2. 히터 OFF
    validations:
      required: true

  - type: input
    id: log
    attributes:
      label: 로그 폴더·커밋
      description: 문제가 기록된 시각(KST)과 코드 버전 (git log -1 --format=%h). 스냅샷이 있으면 파일 이름도
      placeholder: 2026-11-28 14:15 KST , a1b2c3d , logs/snapshots/1795..._L2.jpg
