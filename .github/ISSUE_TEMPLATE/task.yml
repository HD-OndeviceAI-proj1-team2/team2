name: 작업 (REQ 기반)
description: docs/01-requirements.md의 REQ 하나를 구현·작성하는 작업
title: "[REQ-000] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        작업 전에 **docs/01-requirements.md**에서 REQ 번호를 확인해 주세요.
        Title은 `[REQ-번호] 할 일` 형식으로 바꿔 주세요. 예: `[REQ-014] 열화상 고온 영역으로 위험 구역 ROI 생성`
        오른쪽에서 **Assignees**(담당자), **Labels**(역할 1개 + 종류 1개), **Type**을 꼭 지정해 주세요.

  - type: input
    id: req
    attributes:
      label: 관련 REQ 번호
      description: 여러 개면 쉼표로 구분
      placeholder: REQ-014
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: 담당 역할
      options:
        - PM
        - HW
        - SW/AI
        - 통합·문서
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 무엇을 하나요
      description: 이 이슈에서 만들거나 바꿀 것. 어떤 파일을 건드리는지도 적어 주세요.
      placeholder: |
        - vision/thermal_analyzer.py 의 findHotZones() 완성
        - 열화상 프레임에서 후보 온도 이상 영역을 찾아 HotZone 목록으로 반환
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 어떻게 되면 끝난 건지 확인할 수 있게. 관련 테스트(TC) 번호가 있으면 적어 주세요.
      placeholder: |
        - 히터 1개를 켜면 위험 구역(DangerZone) 1개가 생기고 DB events 테이블에 기록됨
        - 관련 TC: TC-005
    validations:
      required: true

  - type: checkboxes
    id: impact
    attributes:
      label: 영향 확인
      options:
        - label: core/models.py / 03-interface.md 변경이 필요함 (→ 팀에 먼저 공유)
        - label: 새 라이브러리 설치가 필요함 (→ requirements.txt 반영)
        - label: 하드웨어 배선·핀 변경이 필요함 (→ config.yaml과 03-interface.md 7번 핀 할당표 반영)

  - type: textarea
    id: notes
    attributes:
      label: 참고·질문
      description: 참고 자료, 막히는 점, 다른 팀원에게 확인할 것
